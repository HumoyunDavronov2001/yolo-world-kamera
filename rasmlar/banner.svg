<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="YOLO-World kamera — 1000 sinfni real vaqtda aniqlash">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <linearGradient id="nur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a3e635" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161f33" stroke-width="1"/>
    </pattern>
    <clipPath id="ekran"><rect x="0" y="0" width="440" height="248" rx="10"/></clipPath>
    <style>
      .sarlavha{font:800 54px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#f8fafc}
      .izoh{font:500 22px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}
      .teg{font:600 15px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .yor{font:700 12px 'DejaVu Sans Mono',Consolas,monospace;fill:#0a0f1a}
      .hol{font:700 12px 'DejaVu Sans Mono',Consolas,monospace;fill:#e2e8f0}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#fon)"/>
  <rect width="1280" height="360" fill="url(#tor)" opacity=".6"/>

  <g transform="translate(64 0)">
    <rect x="0" y="70" width="56" height="56" rx="14" fill="#a3e635"/>
    <rect x="12" y="86" width="32" height="24" rx="5" fill="none" stroke="#0a0f1a" stroke-width="3"/>
    <circle cx="28" cy="98" r="6" fill="none" stroke="#0a0f1a" stroke-width="3"/>
    <text class="sarlavha" x="0" y="190">YOLO-World kamera</text>
    <text class="izoh" x="0" y="232">Noutbuk kamerasida 1000 sinf · ochiq lug'atli aniqlash · CPU</text>
    <g transform="translate(0 270)">
      <rect width="100" height="30" rx="15" fill="#18223a"/><text class="teg" x="50" y="20" text-anchor="middle">Ultralytics</text>
      <rect x="110" width="86" height="30" rx="15" fill="#18223a"/><text class="teg" x="153" y="20" text-anchor="middle">PyTorch</text>
      <rect x="206" width="86" height="30" rx="15" fill="#18223a"/><text class="teg" x="249" y="20" text-anchor="middle">OpenCV</text>
      <rect x="302" width="66" height="30" rx="15" fill="#18223a"/><text class="teg" x="335" y="20" text-anchor="middle">CLIP</text>
    </g>
  </g>

  <!-- Kamera ekrani: sodda buyumlar, skaner va ramkalar (SMIL) -->
  <g transform="translate(780 56)">
    <rect x="-6" y="-6" width="452" height="260" rx="14" fill="#1e293b"/>
    <g clip-path="url(#ekran)">
      <rect width="440" height="150" fill="#cfe3f2"/>
      <rect y="150" width="440" height="98" fill="#b9a38a"/>
      <rect x="110" y="160" width="250" height="10" rx="3" fill="#7a5a3a"/>
      <!-- noutbuk -->
      <rect x="135" y="110" width="76" height="48" rx="4" fill="#334155"/><rect x="125" y="158" width="96" height="6" rx="2" fill="#94a3b8"/>
      <!-- krujka -->
      <rect x="240" y="132" width="28" height="28" rx="5" fill="#f8fafc"/><path d="M268 138 q12 8 0 16" fill="none" stroke="#f8fafc" stroke-width="4"/>
      <!-- gul -->
      <rect x="300" y="138" width="22" height="22" rx="3" fill="#ea580c"/><circle cx="311" cy="128" r="14" fill="#22c55e"/>
      <!-- stul -->
      <rect x="30" y="140" width="14" height="60" fill="#c2410c"/><rect x="30" y="180" width="54" height="10" fill="#ea8a4c"/><rect x="74" y="190" width="8" height="44" fill="#c2410c"/><rect x="32" y="190" width="8" height="44" fill="#c2410c"/>
      <!-- soat -->
      <circle cx="380" cy="60" r="28" fill="#fef3c7" stroke="#92400e" stroke-width="6"/><path d="M380 60 V44 M380 60 L392 66" stroke="#1f2937" stroke-width="3"/>
      <rect x="0" y="0" width="440" height="8" fill="url(#nur)">
        <animate attributeName="y" values="-8;248" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- ramkalar ketma-ket yonadi -->
    <g fill="none" stroke-width="2.5">
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.15;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect x="120" y="104" width="106" height="64" stroke="#a3e635"/><rect x="120" y="88" width="92" height="16" fill="#a3e635" stroke="none"/><text class="yor" x="124" y="100">laptop 0.80</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.3;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect x="24" y="134" width="66" height="104" stroke="#f472b6"/><rect x="24" y="118" width="86" height="16" fill="#f472b6" stroke="none"/><text class="yor" x="28" y="130">chair 0.50</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.45;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect x="346" y="26" width="68" height="68" stroke="#38bdf8"/><rect x="330" y="10" width="86" height="16" fill="#38bdf8" stroke="none"/><text class="yor" x="334" y="22">clock 0.34</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.6;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect x="294" y="110" width="34" height="54" stroke="#fbbf24"/><rect x="294" y="164" width="104" height="16" fill="#fbbf24" stroke="none"/><text class="yor" x="298" y="176">potted plant</text></g>
    </g>
    <rect x="8" y="8" width="168" height="22" rx="4" fill="#0a0f1a" opacity=".7"/>
    <text class="hol" x="16" y="23">FPS 2.5 · 1000 sinf</text>
  </g>
</svg>
